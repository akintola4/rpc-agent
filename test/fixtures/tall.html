<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rpc tall fixture</title>
<style>
  /* A very tall page for the chunked capture test. Layout (CSS px):
     header 56 (sticky, rgb(17,17,17)), then BANDS bands of 700px alternating
     rgb(0,90,255) / rgb(255,200,0), then #reveal (400px, red until an
     IntersectionObserver sees it, then green), then a 200px footer.
     A fixed badge (rgb(0,200,200)) sits at the bottom-right of the viewport. */
  * { box-sizing: border-box; }
  html, body { margin: 0; font: 18px/1.5 system-ui, sans-serif; background: #fff; }
  header {
    position: sticky; top: 0; z-index: 10; height: 56px;
    display: flex; align-items: center; padding: 0 16px;
    background: rgb(17, 17, 17); color: #fff; font-weight: 600;
  }
  .band { height: 700px; padding: 16px 64px 16px 16px; font-size: 40px; font-weight: 700; color: #000; }
  .band:nth-child(odd of .band) { background: rgb(0, 90, 255); }
  .band:nth-child(even of .band) { background: rgb(255, 200, 0); }
  #reveal { height: 400px; display: grid; place-items: center; padding: 0 24px; text-align: center; font-size: 28px; color: #fff; background: rgb(220, 0, 0); }
  #reveal.seen { background: rgb(0, 170, 60); }
  footer { height: 200px; background: rgb(60, 60, 60); color: #fff; padding: 16px; }
  #badge {
    position: fixed; right: 8px; bottom: 8px; width: 40px; height: 40px; z-index: 20;
    border-radius: 8px; background: rgb(0, 200, 200);
  }
</style>
</head>
<body>
<header>Tall fixture</header>
<main id="bands"></main>
<div id="reveal">revealed by IntersectionObserver</div>
<footer>end of page</footer>
<div id="badge"></div>
<script>
  const BANDS = 30; // 56 + 30 * 700 + 400 + 200 = 21656 CSS px
  const main = document.getElementById('bands');
  for (let i = 0; i < BANDS; i++) {
    const d = document.createElement('div');
    d.className = 'band';
    d.textContent = 'Band ' + (i + 1) + ' · y=' + (56 + i * 700);
    main.appendChild(d);
  }
  new IntersectionObserver((entries, obs) => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add('seen'); obs.disconnect(); }
  }).observe(document.getElementById('reveal'));
</script>
</body>
</html>
