<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rpc motion fixture: static</title>
<style>
  /* No animations, pins, reveals or carousels: no Motion findings. A sticky
     header (small, so not a pinned section), a hover transition that never
     runs, an opacity-0 dropdown with no reveal pattern, and a horizontally
     scrollable table without scroll-snap. Also things that look like reveals
     to a loose heuristic but aren't: a slider track parked on its second
     slide with an inline transform, a badge centred with translate(-50%),
     utility classes (overflow-x-scroll, animate-spin, motion-safe) on a
     hidden tooltip, and a 4x4 px dot for rpc record's smallest clip. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; font: 18px/1.5 system-ui, sans-serif; }
  header { position: sticky; top: 0; height: 56px; padding: 0 16px; display: flex; align-items: center; background: #111; color: #fff; }
  main { padding: 24px; }
  a { transition: color 0.2s; }
  a:hover { color: rgb(200, 0, 0); }
  .menu { opacity: 0; pointer-events: none; }
  .table-wrap { overflow-x: auto; }
  table { width: 900px; border-collapse: collapse; }
  td { border: 1px solid #ccc; padding: 8px; }
  .slider { position: relative; width: 300px; height: 80px; overflow: hidden; }
  .slider-track { display: flex; width: 900px; height: 80px; }
  .slider-track > div { flex: 0 0 300px; background: rgb(0, 90, 255); color: #fff; }
  .hero { position: relative; height: 120px; background: rgb(240, 240, 240); }
  .badge { position: absolute; left: 50%; top: 50%; width: 200px; padding: 8px; background: #111; color: #fff; }
  .tip { opacity: 0; width: 160px; }
  #dot { display: block; width: 4px; height: 4px; background: rgb(200, 0, 0); }
  .block { height: 1200px; background: rgb(240, 240, 240); margin-top: 24px; }
</style>
</head>
<body>
<header>Static</header>
<main>
  <p>A page without motion. <a href="#">A link</a>.</p>
  <ul class="menu"><li>Hidden dropdown item</li></ul>
  <div class="table-wrap"><table><tr><td>One</td><td>Two</td><td>Three</td><td>Four</td></tr></table></div>
  <div class="slider"><div class="slider-track" style="transform: translate3d(-300px, 0px, 0px)"><div>One</div><div>Two</div><div>Three</div></div></div>
  <div class="hero"><div class="badge" style="transform: translate(-50%, -50%)">Centred badge</div></div>
  <div class="tip overflow-x-scroll animate-spin motion-safe:animate-none">Tooltip</div>
  <i id="dot"></i>
  <div class="block">Tall block</div>
</main>
</body>
</html>
