<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rpc motion fixture: CSS keyframes</title>
<style>
  /* h1.hero-title runs a finite keyframe animation (8 s, longer than any
     settle cap) and .spinner an infinite one. With --finish-animations the
     title ends at its final colour, rgb(200,0,0). */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; font: 20px/1.4 system-ui, sans-serif; }
  main { padding: 40px; }
  .hero-title {
    margin: 0; padding: 24px; width: 600px; max-width: 100%; height: 140px;
    font-size: 40px; color: #fff; background: rgb(200, 0, 0);
    animation: rise 8s ease-out both;
  }
  @keyframes rise {
    from { background: rgb(0, 0, 0); transform: translateY(60px); }
    to { background: rgb(200, 0, 0); transform: none; }
  }
  .spinner {
    width: 40px; height: 40px; margin-top: 24px; border-radius: 50%;
    border: 6px solid #ddd; border-top-color: #333;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1 class="hero-title">Keyframes</h1>
  <div class="spinner" role="img" aria-label="Loading"></div>
</main>
</body>
</html>
