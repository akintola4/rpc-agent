<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonts fixture</title>
<!-- No crossorigin: the browser fetches this file twice. -->
<link rel="preload" href="/fonts/plex-400-italic.woff2" as="font" type="font/woff2">
<style>
  /* No font-display, used above the fold, not preloaded. */
  @font-face { font-family: "Plex Hero"; src: url(/fonts/plex-400.woff2) format("woff2"); }
  /* Preloaded (without crossorigin) and font-display: swap. */
  @font-face { font-family: "Plex Italic"; src: url(/fonts/plex-400-italic.woff2) format("woff2"); font-style: italic; font-display: swap; }
  body { margin: 0; font: 16px sans-serif; }
  h1 { font-family: "Plex Hero", monospace; }
  em { font-family: "Plex Italic", monospace; }
</style>
</head>
<body>
<h1>Hero headline in a web font</h1>
<p><em>Italic copy</em></p>
</body>
</html>
